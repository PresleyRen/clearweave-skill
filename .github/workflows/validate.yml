name: Validate ClearWeave

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run deterministic regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate skill and source inventory
        run: python3 tools/validate_repo.py
      - name: Archive tracked source
        if: matrix.python-version == '3.13' && github.event_name == 'push'
        run: git archive --format=zip --output=clearweave-source.zip HEAD
      - name: Retain verified source archive
        if: matrix.python-version == '3.13' && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clearweave-source-${{ github.sha }}
          path: clearweave-source.zip
          if-no-files-found: error
          retention-days: 14
