name: Publish ClearWeave release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clearweave-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/validate_repo.py

  release:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare checked release artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, re, subprocess, zipfile
          version = pathlib.Path('VERSION').read_text().strip()
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Invalid version')
          notes = pathlib.Path('docs/releases') / f'v{version}.md'
          if not notes.is_file():
              raise SystemExit('Missing reviewed release notes')
          dist = pathlib.Path('dist'); dist.mkdir(exist_ok=True)
          source = dist / f'clearweave-v{version}.zip'
          subprocess.run(['git', 'archive', '--format=zip', f'--output={source}', 'HEAD'], check=True)
          skill = dist / f'clearweave-skill-v{version}.zip'
          tracked = subprocess.check_output(['git', 'ls-files', '-z', 'skills/clearweave'], text=True).split('\0')
          with zipfile.ZipFile(skill, 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in sorted(x for x in tracked if x):
                  path = pathlib.Path(name)
                  archive.write(path, str(path.relative_to('skills')))
          (dist / 'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in (source, skill)))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RELEASE_VERSION={version}\n')
          PY
      - name: Create release without replacing an existing tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "ClearWeave ${tag} · Traceable bilingual editing" --notes-file "docs/releases/${tag}.md"
          gh release view "$tag" --json url,tagName,targetCommitish,isDraft
