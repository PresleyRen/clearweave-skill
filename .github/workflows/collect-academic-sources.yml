name: Collect academic writing sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-academic-sources.yml'
      - 'tools/collect_academic_sources.py'
      - 'tests/test_academic_sources.py'
      - 'evals/academic-sources/**'
  pull_request:
    paths:
      - '.github/workflows/collect-academic-sources.yml'
      - 'tools/collect_academic_sources.py'
      - 'tests/test_academic_sources.py'
      - 'evals/academic-sources/**'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Test parser, failures and real source records
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/validate_repo.py
          python3 tools/collect_academic_sources.py --replay-fixtures
      - name: Fetch pinned references and require complete abstracts
        run: python3 tools/collect_academic_sources.py --download --out research
      - name: Keep data and diagnostics on either outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: clearweave-academic-research
          path: research/
          retention-days: 7
          if-no-files-found: warn
