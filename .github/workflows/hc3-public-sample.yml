name: Collect HC3 public evaluation sample

on:
  push:
    branches: [main]
    paths: ['.github/workflows/hc3-public-sample.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Download public data, fix selection, and record hashes
        run: |
          python3 - <<'PY'
          import collections, datetime, hashlib, json, pathlib, re, sys, urllib.request
          sys.path.insert(0, 'skills/clearweave/scripts')
          import clearweave_check as check
          out = pathlib.Path('hc3-sample'); out.mkdir()
          seed = 'clearweave-hc3-20261020-v1'
          def sha(data): return hashlib.sha256(data).hexdigest()
          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent':'ClearWeave-research-evaluation/0.2.0'})
              with urllib.request.urlopen(req, timeout=90) as response: return response.read()
          manifest = {'schema_version':1, 'seed':seed, 'skill_commit':'c5ad877b0d98c4d2bf20788e611839c00fa1188e', 'retrieved_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(), 'selection':'SHA256(seed|language|zero-based-row) ascending; first 6 eligible ChatGPT answers per language, plus first 2 eligible human answers at other questions per language. Answer index 0 only.', 'split_warning':'The HF raw domain files are exposed as train. This is a public-corpus evaluation slice, NOT the paper official test partition, and NOT guaranteed unseen during host-model pretraining.', 'copyright':'HC3 CC BY-SA 4.0 subject to stricter underlying-source terms. Upstream lists wiki_csai as CC BY-SA and Chinese open_qa as MIT. Excerpts and adapted outputs must retain attribution and share-alike scope; repository MIT does not relicense the dataset.', 'files':[], 'scan_summary':[], 'skill_hashes':{str(p):sha(p.read_bytes()) for p in sorted(pathlib.Path('skills/clearweave').rglob('*')) if p.is_file() and '__pycache__' not in str(p)}}
          samples=[]
          for lang, repo, filename in [('en','Hello-SimpleAI/HC3','wiki_csai.jsonl'),('zh','Hello-SimpleAI/HC3-Chinese','open_qa.jsonl')]:
              meta=json.loads(fetch('https://huggingface.co/api/datasets/'+repo))
              revision=meta['sha']
              url=f'https://huggingface.co/datasets/{repo}/resolve/{revision}/{filename}'
              raw=fetch(url)
              rows=[json.loads(line) for line in raw.decode('utf-8').splitlines() if line.strip()]
              manifest['files'].append({'language':lang,'repo':repo,'revision':revision,'file':filename,'url':url,'sha256':sha(raw),'rows':len(rows),'bytes':len(raw)})
              counts=collections.Counter()
              # Baseline-only corpus scan; no rewriting or authorship evaluation.
              candidates=[]
              for row_index,row in enumerate(rows):
                  arr=row.get('chatgpt_answers') or []
                  if not arr: continue
                  text=arr[0]
                  candidates.append((sha(f'{seed}|{lang}|{row_index}'.encode()),row_index,row))
              candidates.sort()
              selected_questions=set()
              for field,label,limit in [('chatgpt_answers','chatgpt',6),('human_answers','human',2)]:
                  group=[]
                  for rank,row_index,row in candidates:
                      if field=='human_answers' and row_index in selected_questions: continue
                      arr=row.get(field) or []
                      if not arr or not isinstance(arr[0],str): continue
                      text=arr[0]; question=row.get('question','')
                      length=len(text.split()) if lang=='en' else len(text)
                      if not (90 <= length <= 230 if lang=='en' else 170 <= length <= 450): continue
                      # Chinese open_qa is broad; restrict to computing/software questions before editing.
                      if lang=='zh' and not re.search(r'计算机|计算|电脑|软件|程序|编程|算法|数据库|数据结构|人工智能|机器学习|互联网|网络|编译|操作系统|硬盘|内存|浏览器', question): continue
                      if lang=='zh' and re.search(r'药|病|癌|怀孕|股票|基金|贷款|借贷|赌博|色情|自杀|破解密码|盗号', question): continue
                      group.append({'id':f'HC3-{lang.upper()}-{label.upper()}-{row_index:05d}','language':lang,'label':label,'dataset':repo,'revision':revision,'file':filename,'row_index':row_index,'answer_field':field,'answer_index':0,'question':question,'original':text,'original_sha256':sha(text.encode()),'selection_rank':rank,'source_url':url})
                      selected_questions.add(row_index)
                      if len(group)==limit: break
                  if len(group)!=limit: raise RuntimeError(f'Insufficient candidates {lang}/{field}: {len(group)}')
                  samples.extend(group)
              manifest['scan_summary'].append({'language':lang,'all_question_rows':len(rows),'chatgpt_answer0_candidates_before_length_filter':len(candidates)})
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (out/'samples.json').write_text(json.dumps(samples,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'samples':len(samples),'datasets':manifest['files'],'sample_ids':[s['id'] for s in samples]},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hc3-public-evaluation-sample
          path: hc3-sample/
          if-no-files-found: error
          retention-days: 30
